openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: competency
    description: Katalog klasifikasi, jabatan, standar, dan unit kompetensi
  - name: agents
    description: Latihan uji kompetensi melalui agen AI spesialis
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /competency/catalog:
    get:
      operationId: getCompetencyCatalog
      tags: [competency]
      summary: Mendapatkan katalog kompetensi lintas klasifikasi
      responses:
        "200":
          description: Katalog jabatan, standar, dan unit yang sudah tercatat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetencyCatalog"
  /competency/summary:
    get:
      operationId: getCompetencySummary
      tags: [competency]
      summary: Mendapatkan ringkasan kesiapan katalog
      responses:
        "200":
          description: Ringkasan cakupan data dan agen spesialis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetencySummary"
  /agents/practice-turn:
    post:
      operationId: createPracticeTurn
      tags: [agents]
      summary: Memulai atau melanjutkan satu giliran latihan kompetensi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PracticeTurnInput"
      responses:
        "200":
          description: Pertanyaan latihan atau evaluasi jawaban
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeTurnResponse"
        "400":
          description: Masukan tidak valid atau unit belum tersedia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Batas penggunaan sementara tercapai
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Layanan AI belum berhasil menyelesaikan permintaan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ujk/passport:
    get:
      operationId: getUjkPassport
      responses:
        "200":
          description: Paspor milik peserta yang masuk
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UjkPassport" }
        default:
          description: Permintaan ditolak
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /ujk/journeys:
    post:
      operationId: createUjkJourney
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UjkJourneyInput" }
      responses:
        "200":
          description: Jalur persiapan dibuat atau sudah ada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UjkJourneySummary" }
        default:
          description: Permintaan ditolak
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /ujk/journeys/{id}:
    parameters: [{ $ref: "#/components/parameters/UjkJourneyId" }]
    get:
      operationId: getUjkJourney
      responses:
        "200":
          description: Unit, bukti, dan gerbang kesiapan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UjkJourneyDetail" }
        default:
          description: Permintaan ditolak
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /ujk/journeys/{id}/self-assessment:
    parameters: [{ $ref: "#/components/parameters/UjkJourneyId" }]
    post:
      operationId: createUjkSelfAssessment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UjkSelfAssessmentInput" }
      responses:
        "200":
          description: Catatan asesmen mandiri ditambahkan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UjkJourneyDetail" }
        default:
          description: Permintaan ditolak
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /ujk/journeys/{id}/safety:
    parameters: [{ $ref: "#/components/parameters/UjkJourneyId" }]
    post:
      operationId: createUjkSafetyAttempt
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UjkSafetyInput" }
      responses:
        "200":
          description: Hasil gerbang K3 internal dan kesiapan terbaru
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UjkSafetyResult" }
        default:
          description: Permintaan ditolak
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /ujk/journeys/{id}/uploads:
    parameters: [{ $ref: "#/components/parameters/UjkJourneyId" }]
    post:
      operationId: requestUjkEvidenceUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UjkUploadInput" }
      responses:
        "200":
          description: Unggah langsung ke penyimpanan privat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UjkUploadResponse" }
        default:
          description: Permintaan ditolak
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /ujk/journeys/{id}/evidence:
    parameters: [{ $ref: "#/components/parameters/UjkJourneyId" }]
    post:
      operationId: createUjkEvidence
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UjkEvidenceInput" }
      responses:
        "200":
          description: Bukti dicatat, belum diverifikasi asesor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UjkJourneyDetail" }
        default:
          description: Permintaan ditolak
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /ujk/journeys/{id}/notes:
    parameters: [{ $ref: "#/components/parameters/UjkJourneyId" }]
    post:
      operationId: createUjkCorrection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UjkCorrectionInput" }
      responses:
        "200":
          description: Koreksi ditambahkan tanpa menimpa riwayat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UjkJourneyDetail" }
        default:
          description: Permintaan ditolak
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /ujk/journeys/{id}/history/{before}:
    parameters:
      - { $ref: "#/components/parameters/UjkJourneyId" }
      - name: before
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getUjkHistory
      responses:
        "200":
          description: Riwayat append-only, halaman 50 catatan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UjkHistory" }
        default:
          description: Permintaan ditolak
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
components:
  parameters:
    UjkJourneyId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    UjkJourneyInput:
      type: object
      properties:
        roleId: { type: string, minLength: 1 }
        consent: { type: boolean }
      required: [roleId, consent]
    UjkJourneySummary:
      type: object
      properties:
        id: { type: string }
        roleId: { type: string }
        title: { type: string }
        createdAt: { type: string }
        status: { type: string, enum: [belum_siap, perlu_perbaikan, siap_diajukan] }
        learnedCount: { type: integer }
        unitCount: { type: integer }
        schemeVerified: { type: boolean }
        safetyPassed: { type: boolean }
      required: [id, roleId, title, createdAt, status, learnedCount, unitCount, schemeVerified, safetyPassed]
    UjkPassport:
      type: object
      properties:
        journeys:
          type: array
          items: { $ref: "#/components/schemas/UjkJourneySummary" }
      required: [journeys]
    UjkUnitState:
      type: object
      properties:
        code: { type: string }
        title: { type: string }
        learned: { type: boolean }
        confidence: { type: string, enum: [none, learning, practiced, confident] }
        lastScore: { type: ["integer", "null"] }
        plan: { type: string }
        safetyCritical: { type: boolean }
        evidenceCount: { type: integer }
        reviewedEvidenceCount: { type: integer }
        gaps: { type: array, items: { type: string } }
      required: [code, title, learned, confidence, lastScore, plan, safetyCritical, evidenceCount, reviewedEvidenceCount, gaps]
    UjkEvidence:
      type: object
      properties:
        id: { type: string }
        unitCode: { type: string }
        title: { type: string }
        description: { type: string }
        fileName: { type: string }
        size: { type: integer }
        contentType: { type: string }
        createdAt: { type: string }
        downloadUrl: { type: string }
        valid: { type: boolean }
        authentic: { type: boolean }
        current: { type: boolean }
        sufficient: { type: boolean }
        reviewStatus: { type: string, enum: [pending, accepted, rejected] }
      required: [id, unitCode, title, description, fileName, size, contentType, createdAt, downloadUrl, valid, authentic, current, sufficient, reviewStatus]
    UjkSafetyQuestion:
      type: object
      properties:
        id: { type: string }
        question: { type: string }
        choices: { type: array, items: { type: string } }
        sourceNote: { type: string }
      required: [id, question, choices, sourceNote]
    UjkJourneyDetail:
      type: object
      properties:
        journey: { $ref: "#/components/schemas/UjkJourneySummary" }
        units: { type: array, items: { $ref: "#/components/schemas/UjkUnitState" } }
        evidence: { type: array, items: { $ref: "#/components/schemas/UjkEvidence" } }
        safetyQuestions: { type: array, items: { $ref: "#/components/schemas/UjkSafetyQuestion" } }
        blockers: { type: array, items: { type: string } }
        threshold: { type: integer }
        simulationPassed: { type: boolean }
        ruleNote: { type: string }
        schemeNote: { type: string }
      required: [journey, units, evidence, safetyQuestions, blockers, threshold, simulationPassed, ruleNote, schemeNote]
    UjkSelfAssessmentInput:
      type: object
      properties:
        unitCode: { type: string, minLength: 1 }
        confidence: { type: string, enum: [none, learning, practiced, confident] }
        learned: { type: boolean }
        plan: { type: string, maxLength: 3000 }
        reason: { type: string, minLength: 3, maxLength: 2000 }
      required: [unitCode, confidence, learned, plan, reason]
    UjkSafetyInput:
      type: object
      properties:
        answers:
          type: array
          minItems: 3
          maxItems: 3
          items: { type: integer, minimum: 0, maximum: 2 }
      required: [answers]
    UjkSafetyResult:
      type: object
      properties:
        passed: { type: boolean }
        feedback: { type: array, items: { type: string } }
        detail: { $ref: "#/components/schemas/UjkJourneyDetail" }
      required: [passed, feedback, detail]
    UjkUploadInput:
      type: object
      properties:
        unitCode: { type: string, minLength: 1 }
        name: { type: string, minLength: 1, maxLength: 200 }
        size: { type: integer, minimum: 1, maximum: 10485760 }
        contentType: { type: string, enum: [application/pdf, image/png, image/jpeg] }
      required: [unitCode, name, size, contentType]
    UjkUploadResponse:
      type: object
      properties:
        uploadId: { type: string }
        uploadURL: { type: string }
      required: [uploadId, uploadURL]
    UjkEvidenceInput:
      type: object
      properties:
        uploadId: { type: string, format: uuid }
        title: { type: string, minLength: 3, maxLength: 200 }
        description: { type: string, minLength: 3, maxLength: 3000 }
        valid: { type: boolean }
        authentic: { type: boolean }
        current: { type: boolean }
        sufficient: { type: boolean }
      required: [uploadId, title, description, valid, authentic, current, sufficient]
    UjkCorrectionInput:
      type: object
      properties:
        note: { type: string, minLength: 3, maxLength: 3000 }
      required: [note]
    UjkHistoryEvent:
      type: object
      properties:
        id: { type: integer }
        kind: { type: string }
        unitCode: { type: ["string", "null"] }
        summary: { type: string }
        createdAt: { type: string }
        question: { type: ["string", "null"] }
        answer: { type: ["string", "null"] }
        score: { type: ["integer", "null"] }
      required: [id, kind, unitCode, summary, createdAt, question, answer, score]
    UjkHistory:
      type: object
      properties:
        events: { type: array, items: { $ref: "#/components/schemas/UjkHistoryEvent" } }
        nextCursor: { type: ["integer", "null"] }
      required: [events, nextCursor]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CompetencyClassification:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        available:
          type: boolean
        roleCount:
          type: integer
        practiceRoleCount:
          type: integer
        sourceStatus:
          type: string
      required: [id, name, description, available, roleCount, practiceRoleCount, sourceStatus]
    CompetencyStandard:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        standardType:
          type: string
        code:
          type: string
        year:
          type: ["integer", "null"]
        registrationCode:
          type: ["string", "null"]
        sourceUrl:
          type: ["string", "null"]
        status:
          type: string
        statusNote:
          type: string
      required:
        [id, title, standardType, code, year, registrationCode, sourceUrl, status, statusNote]
    JobRole:
      type: object
      properties:
        id:
          type: string
        classificationId:
          type: string
        family:
          type: string
        title:
          type: string
        qualification:
          type: string
        level:
          type: integer
        standardId:
          type: string
        unitCount:
          type: integer
        readiness:
          type: string
        subClassification:
          type: string
        reportedStandard:
          type: string
        reportedStandardStatus:
          type: string
        pkbRequired:
          type: boolean
        mvpPhase:
          type: string
        practiceAvailable:
          type: boolean
        reviewNotes:
          type: array
          items:
            type: string
      required:
        [id, classificationId, family, title, qualification, level, standardId, unitCount, readiness, subClassification, reportedStandard, reportedStandardStatus, pkbRequired, mvpPhase, practiceAvailable, reviewNotes]
    CompetencyUnit:
      type: object
      properties:
        code:
          type: string
        title:
          type: string
        standardId:
          type: string
        sourceNote:
          type: string
      required: [code, title, standardId, sourceNote]
    CompetencyCatalog:
      type: object
      properties:
        classifications:
          type: array
          items:
            $ref: "#/components/schemas/CompetencyClassification"
        standards:
          type: array
          items:
            $ref: "#/components/schemas/CompetencyStandard"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/JobRole"
        units:
          type: array
          items:
            $ref: "#/components/schemas/CompetencyUnit"
      required: [classifications, standards, roles, units]
    AgentProfile:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        responsibility:
          type: string
      required: [id, name, responsibility]
    CompetencySummary:
      type: object
      properties:
        classificationCount:
          type: integer
        roleCount:
          type: integer
        unitCount:
          type: integer
        reviewCount:
          type: integer
        agents:
          type: array
          items:
            $ref: "#/components/schemas/AgentProfile"
      required: [classificationCount, roleCount, unitCount, reviewCount, agents]
    PracticeHistoryMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 5000
      required: [role, content]
    PracticeTurnInput:
      type: object
      properties:
        journeyId:
          type: string
          format: uuid
        attemptId:
          type: string
          format: uuid
        action:
          type: string
          enum: [start, answer]
        mode:
          type: string
          enum: [practice, assessment]
        roleId:
          type: string
        unitCode:
          type: string
        history:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/PracticeHistoryMessage"
        answer:
          type: string
          maxLength: 5000
      required: [action, mode, roleId, unitCode, history]
    PracticeEvaluation:
      type: object
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 100
        status:
          type: string
          enum: [needs_practice, developing, ready_for_practice]
        strengths:
          type: array
          items:
            type: string
        gaps:
          type: array
          items:
            type: string
        evidenceChecklist:
          type: array
          items:
            type: string
        nextStep:
          type: string
      required: [score, status, strengths, gaps, evidenceChecklist, nextStep]
    SourceCitation:
      type: object
      properties:
        standardId:
          type: string
        title:
          type: string
        url:
          type: string
        unitCode:
          type: string
        note:
          type: string
      required: [standardId, title, url, unitCode, note]
    AgentRun:
      type: object
      properties:
        agentId:
          type: string
        agentName:
          type: string
        responsibility:
          type: string
        status:
          type: string
          enum: [complete, skipped]
      required: [agentId, agentName, responsibility, status]
    PracticeTurnResponse:
      type: object
      properties:
        response:
          type: string
        question:
          type: ["string", "null"]
        evaluation:
          anyOf:
            - $ref: "#/components/schemas/PracticeEvaluation"
            - type: "null"
        citations:
          type: array
          items:
            $ref: "#/components/schemas/SourceCitation"
        agentRuns:
          type: array
          items:
            $ref: "#/components/schemas/AgentRun"
      required: [response, question, evaluation, citations, agentRuns]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

